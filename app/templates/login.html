{% extends 'base.html' %}
{% block content %}
<div style="max-width: 400px; margin: 40px auto;">
    <h2>Iniciar Sesión</h2>
    <form method="POST">
        <label>Correo Electrónico:</label><br>
        <input type="email" name="email" required style="width: 100%; margin-bottom: 15px;"><br>
        
        <label>Contraseña:</label><br>
        <input type="password" name="password" required style="width: 100%; margin-bottom: 15px;"><br>
        
        <button type="submit" class="btn-guardar">Entrar</button>
    </form>
    <p style="margin-top: 15px;">¿No tienes cuenta? <a href="{{ url_for('register') }}">Regístrate aquí</a></p>
</div>
{% endblock %}
